name: "Publish to Official MCP Registry"

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish-mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          tar xzf "$archive" mcp-publisher
          chmod +x mcp-publisher
          rm -f "$archive"

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish Unified & Specialized MCP Servers to Official Registry
        run: |
          set -euo pipefail
          ./mcp-publisher publish server.json
          ./mcp-publisher publish registry_manifests/prediction-market-arb.json
          ./mcp-publisher publish registry_manifests/crypto-funding-carry.json
          ./mcp-publisher publish registry_manifests/shopify-leads-tech-stack.json
