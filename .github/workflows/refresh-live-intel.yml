name: Refresh Live Quant & B2B Intel Feed

on:
  schedule:
    # Runs every hour at :12 UTC on this PUBLIC repository (0 private GitHub Actions minutes!)
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-intel-feed
  cancel-in-progress: false

jobs:
  refresh-feed:
    name: Pull Public Market APIs & Commit live_feed.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11 (stdlib only — zero pip overhead)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch live Polymarket, Kalshi, Hyperliquid, Kraken & dYdX spreads
        run: python scripts/update_live_preview.py

      - name: Commit & push updated docs/data/live_feed.json
        run: |
          git config user.name "quant-intel-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/live_feed.json
          if git diff --cached --quiet; then
            echo "No changes in live_feed.json."
          else
            TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "chore(intel): hourly live feed snapshot ${TS} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
